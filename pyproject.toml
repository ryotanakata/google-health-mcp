[project]
name = "google-health-mcp"
version = "0.1.0"
description = "Remote MCP server exposing Google Health API data (mainly Google Fitbit Air) to Claude"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
